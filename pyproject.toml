[project]
name = "jevlang"
version = "0.1.0"
description = "The simplest way to write decision workflows in Python, backed by TypeSafe's Jev model"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suman Michael" }]
readme = "README.md"
keywords = ["jev", "typesafe", "classifier", "decision", "triage", "routing", "transpiler"]
dependencies = ["typesafe-sdk>=0.7,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/sumanmichael/jevlang"
Issues = "https://github.com/sumanmichael/jevlang/issues"
Changelog = "https://github.com/sumanmichael/jevlang/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sumanmichael/jevlang/blob/main/docs/reference.md"

[dependency-groups]
dev = ["pytest", "commitizen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevlang"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
builtins = ["__jev__"]  # the runtime name both rewrite passes call into

[tool.ruff.lint.per-file-ignores]
"*.jev" = ["F841"]  # a jev block always binds prob/confidence/probs, used or not

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"        # [project] version is the single source of truth
version_files = [
    ".claude-plugin/plugin.json:\"version\"",  # Claude Code only refetches the skill when this changes
]
tag_format = "v$version"
annotated_tag = true
major_version_zero = true          # while 0.x, a breaking change bumps the minor, not to 1.0.0
update_changelog_on_bump = true
changelog_incremental = true
